<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" font-family="Arial, Helvetica, sans-serif">
<rect width="1400" height="1020" fill="#ffffff"/>
<text x="40" y="60" font-size="26" font-weight="bold" fill="#111111">Wiring diagram: Arduino UNO, HC-06, MPU6050 and 5 servos</text>

