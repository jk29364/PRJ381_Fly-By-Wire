<g fill="#222222"><circle cx="20" cy="380" r="5"/><circle cx="20" cy="680" r="5"/><circle cx="850" cy="870" r="5"/><circle cx="20" cy="870" r="5"/><circle cx="1250" cy="870" r="5"/><circle cx="1250" cy="182" r="5"/><circle cx="1250" cy="262" r="5"/><circle cx="1250" cy="342" r="5"/><circle cx="1250" cy="422" r="5"/><circle cx="1250" cy="502" r="5"/><circle cx="1250" cy="582" r="5"/><circle cx="1250" cy="662" r="5"/></g>
<circle cx="330" cy="250" r="5" fill="#1f77b4"/>
<rect x="520" y="110" width="240" height="680" rx="12" fill="#0f766e" stroke="#064e46" stroke-width="2"/>
<text x="640" y="450" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Arduino UNO</text>
<g font-size="15" fill="#ffffff"><text x="532" y="175">D0 (RX)</text><text x="532" y="255">D1 (TX)</text><text x="532" y="525">3V3</text><text x="532" y="605">A4 (SDA)</text><text x="532" y="665">A5 (SCL)</text>
<text x="748" y="175" text-anchor="end">D4</text>
