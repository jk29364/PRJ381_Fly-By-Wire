<path d="M40 840 H1210" stroke="#d62728"/>
<path d="M20 870 H1250" stroke="#222222"/>
</g>

<g fill="#d62728"><circle cx="820" cy="840" r="5"/><circle cx="1210" cy="158" r="5"/><circle cx="1210" cy="238" r="5"/><circle cx="1210" cy="318" r="5"/><circle cx="1210" cy="398" r="5"/><circle cx="1210" cy="478" r="5"/><circle cx="1210" cy="840" r="5"/><circle cx="40" cy="840" r="5"/></g>
<g fill="#222222"><circle cx="20" cy="380" r="5"/><circle cx="20" cy="680" r="5"/><circle cx="850" cy="870" r="5"/><circle cx="1250" cy="182" r="5"/><circle cx="1250" cy="262" r="5"/><circle cx="1250" cy="342" r="5"/><circle cx="1250" cy="422" r="5"/><circle cx="1250" cy="502" r="5"/><circle cx="1250" cy="870" r="5"/><circle cx="20" cy="870" r="5"/></g>
<circle cx="330" cy="250" r="5" fill="#1f77b4"/>

<rect x="520" y="110" width="240" height="640" rx="12" fill="#0f766e" stroke="#064e46" stroke-width="2"/>
<text x="640" y="430" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Arduino UNO</text>
<g font-size="15" fill="#ffffff">
<text x="532" y="175">D0 (RX)</text>
<text x="532" y="255">D1 (TX)</text>
<text x="532" y="525">3V3</text>
<text x="532" y="605">A4 (SDA)</text>
<text x="532" y="665">A5 (SCL)</text>
<text x="748" y="175" text-anchor="end">D10</text>
<text x="748" y="255" text-anchor="end">D9</text>
<text x="748" y="335" text-anchor="end">D6</text>
<text x="748" y="415" text-anchor="end">D5</text>
<text x="748" y="495" text-anchor="end">D3</text>
<text x="748" y="595" text-anchor="end">5V</text>
<text x="748" y="675" text-anchor="end">GND</text>
</g>

<rect x="60" y="120" width="170" height="160" rx="10" fill="#6a4c93" stroke="#3f2b63" stroke-width="2"/>
<text x="145" y="215" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">HC-06</text>
<g font-size="14" fill="#ffffff">
<text x="70" y="175">VCC</text><text x="70" y="255">GND</text>
<text x="220" y="175" text-anchor="end">TXD</text><text x="220" y="255" text-anchor="end">RXD</text>
</g>

<rect x="60" y="490" width="170" height="220" rx="10" fill="#6a4c93" stroke="#3f2b63" stroke-width="2"/>
<text x="145" y="565" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MPU6050</text>
<text x="145" y="587" font-size="13" fill="#ffffff" text-anchor="middle">(GY-521)</text>
<g font-size="14" fill="#ffffff">
<text x="220" y="525" text-anchor="end">VCC</text>
<text x="220" y="605" text-anchor="end">SDA</text>
<text x="220" y="665" text-anchor="end">SCL</text>
<text x="70" y="685">GND</text>
</g>

<rect x="360" y="240" width="80" height="20" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="400" y="228" font-size="14" fill="#111111" text-anchor="middle">R1 1 kΩ</text>
<rect x="320" y="300" width="20" height="50" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="352" y="330" font-size="14" fill="#111111">R2 2 kΩ</text>

<g fill="#4b5563" stroke="#1f2937" stroke-width="2">
<rect x="1000" y="145" width="150" height="50" rx="8"/>
<rect x="1000" y="225" width="150" height="50" rx="8"/>
<rect x="1000" y="305" width="150" height="50" rx="8"/>
<rect x="1000" y="385" width="150" height="50" rx="8"/>
<rect x="1000" y="465" width="150" height="50" rx="8"/>
</g>
<g font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">
<text x="1070" y="175">Servo 1</text>
<text x="1070" y="255">Servo 2</text>
<text x="1070" y="335">Servo 3</text>
<text x="1070" y="415">Servo 4</text>
<text x="1070" y="495">Servo 5</text>
</g>
<g font-size="12" fill="#ffffff">
<text x="1008" y="175">SIG</text><text x="1008" y="255">SIG</text><text x="1008" y="335">SIG</text><text x="1008" y="415">SIG</text><text x="1008" y="495">SIG</text>
</g>
<g font-size="12" fill="#ffffff" text-anchor="end">
<text x="1142" y="162">V+</text><text x="1142" y="190">GND</text>
<text x="1142" y="242">V+</text><text x="1142" y="270">GND</text>
<text x="1142" y="322">V+</text><text x="1142" y="350">GND</text>
<text x="1142" y="402">V+</text><text x="1142" y="430">GND</text>
<text x="1142" y="482">V+</text><text x="1142" y="510">GND</text>
</g>
<g font-size="12" fill="#111111">
<text x="880" y="165" text-anchor="middle">D10</text>
<text x="880" y="245" text-anchor="middle">D9</text>
<text x="880" y="325" text-anchor="middle">D6</text>
<text x="880" y="405" text-anchor="middle">D5</text>
<text x="880" y="485" text-anchor="middle">D3</text>
</g>

<text x="600" y="830" font-size="15" font-weight="bold" fill="#d62728" text-anchor="middle">5V bus</text>
<text x="600" y="895" font-size="15" font-weight="bold" fill="#222222" text-anchor="middle">GND bus</text>

<g stroke-width="4" stroke-linecap="round">
<line x1="40" y1="940" x2="75" y2="940" stroke="#d62728"/><text x="85" y="945" font-size="14" fill="#111111">5V</text>
<line x1="150" y1="940" x2="185" y2="940" stroke="#222222"/><text x="195" y="945" font-size="14" fill="#111111">GND</text>
<line x1="270" y1="940" x2="305" y2="940" stroke="#ff7f0e"/><text x="315" y="945" font-size="14" fill="#111111">3V3</text>
<line x1="390" y1="940" x2="425" y2="940" stroke="#d4a017"/><text x="435" y="945" font-size="14" fill="#111111">Servo signal</text>
<line x1="560" y1="940" x2="595" y2="940" stroke="#2ca02c"/><line x1="600" y1="940" x2="635" y2="940" stroke="#1f77b4"/><text x="645" y="945" font-size="14" fill="#111111">HC-06 serial (TXD, RXD)</text>
<line x1="850" y1="940" x2="885" y2="940" stroke="#8e44ad"/><line x1="890" y1="940" x2="925" y2="940" stroke="#16a085"/><text x="935" y="945" font-size="14" fill="#111111">I2C (SDA, SCL)</text>
</g>
<g font-size="14" fill="#374151">
<text x="40" y="975">Crossing wires without a dot are not connected.</text>
<text x="40" y="997">Power the servos from a separate 5V supply and join its GND to the Arduino GND. Unplug the HC-06 from D0/D1 while uploading code.</text>
</g>
</svg>
