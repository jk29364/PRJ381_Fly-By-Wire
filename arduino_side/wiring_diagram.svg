<path d="M60 250 H20 V870" stroke="#222222"/>
<path d="M230 520 H520" stroke="#ff7f0e"/>
<path d="M230 600 H520" stroke="#8e44ad"/>
<path d="M230 660 H520" stroke="#16a085"/>
<path d="M60 680 H20" stroke="#222222"/>
<path d="M760 170 H1000 M760 250 H1000 M760 330 H1000 M760 410 H1000 M760 490 H1000" stroke="#d4a017"/>
<path d="M1150 158 H1210 M1150 238 H1210 M1150 318 H1210 M1150 398 H1210 M1150 478 H1210" stroke="#d62728"/>
