<g font-size="14" fill="#ffffff"><text x="70" y="175">VCC</text><text x="70" y="255">GND</text><text x="220" y="175" text-anchor="end">TXD</text><text x="220" y="255" text-anchor="end">RXD</text></g>
<rect x="60" y="490" width="170" height="220" rx="10" fill="#6a4c93" stroke="#3f2b63" stroke-width="2"/><text x="145" y="565" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">MPU6050</text><text x="145" y="587" font-size="13" fill="#ffffff" text-anchor="middle">(GY-521)</text>
<g font-size="14" fill="#ffffff"><text x="220" y="525" text-anchor="end">VCC</text><text x="220" y="605" text-anchor="end">SDA</text><text x="220" y="665" text-anchor="end">SCL</text><text x="70" y="685">GND</text></g>
<rect x="360" y="240" width="80" height="20" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="400" y="228" font-size="14" fill="#111111" text-anchor="middle">R1 1 kΩ</text>
<rect x="320" y="300" width="20" height="50" rx="3" fill="#ffffff" stroke="#333333" stroke-width="2"/><text x="352" y="330" font-size="14" fill="#111111">R2 2 kΩ</text>
<rect x="1000" y="145" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="167" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 1</text>
<text x="1008" y="187" font-size="11" fill="#e5e7eb" text-anchor="start">RUDDER</text>
<text x="1008" y="158" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="161" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="190" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="162" font-size="12" fill="#111111" text-anchor="middle">D4</text>
<rect x="1000" y="225" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="247" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 2</text>
<text x="1008" y="267" font-size="11" fill="#e5e7eb" text-anchor="start">TAIL RIGHT</text>
<text x="1008" y="238" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="241" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="270" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="242" font-size="12" fill="#111111" text-anchor="middle">D6</text>
<rect x="1000" y="305" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="327" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 3</text>
<text x="1008" y="347" font-size="11" fill="#e5e7eb" text-anchor="start">TAIL LEFT</text>
<text x="1008" y="318" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="321" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="350" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="322" font-size="12" fill="#111111" text-anchor="middle">D7</text>
<rect x="1000" y="385" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="407" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 4</text>
<text x="1008" y="427" font-size="11" fill="#e5e7eb" text-anchor="start">RIGHT WING INNER</text>
<text x="1008" y="398" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="401" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="430" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="402" font-size="12" fill="#111111" text-anchor="middle">D8</text>
<rect x="1000" y="465" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="487" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 5</text>
<text x="1008" y="507" font-size="11" fill="#e5e7eb" text-anchor="start">RIGHT WING OUTER</text>
<text x="1008" y="478" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="481" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="510" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="482" font-size="12" fill="#111111" text-anchor="middle">D9</text>
<rect x="1000" y="545" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="567" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 6</text>
<text x="1008" y="587" font-size="11" fill="#e5e7eb" text-anchor="start">LEFT WING INNER</text>
<text x="1008" y="558" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="561" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="590" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="562" font-size="12" fill="#111111" text-anchor="middle">D11</text>
<rect x="1000" y="625" width="150" height="50" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>
<text x="1070" y="647" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo 7</text>
<text x="1008" y="667" font-size="11" fill="#e5e7eb" text-anchor="start">LEFT WING OUTER</text>
<text x="1008" y="638" font-size="11" fill="#ffffff">SIG</text>
<text x="1142" y="641" font-size="11" fill="#ffffff" text-anchor="end">V+</text><text x="1142" y="670" font-size="11" fill="#ffffff" text-anchor="end">GND</text>
<text x="880" y="642" font-size="12" fill="#111111" text-anchor="middle">D12</text>
<rect x="1100" y="900" width="260" height="80" rx="10" fill="#b45309" stroke="#78350f" stroke-width="2"/>
<text x="1230" y="936" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Servo power supply</text>
<text x="1230" y="956" font-size="12" fill="#ffffff" text-anchor="middle">5-6 V, 5 A or more (e.g. XL4015 set to 5.5 V)</text>
<text x="1230" y="972" font-size="12" fill="#ffffff" text-anchor="middle">+ 1000 µF capacitor across + and -</text>
<text x="1198" y="893" font-size="14" font-weight="bold" fill="#d62728" text-anchor="end">+</text><text x="1262" y="893" font-size="14" font-weight="bold" fill="#222222">-</text>
<text x="600" y="822" font-size="14" font-weight="bold" fill="#d62728" text-anchor="middle">Arduino 5V (HC-06 only)</text>
<text x="600" y="890" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Common GND bus (Arduino + HC-06 + MPU6050 + servo supply)</text>
<text x="1360" y="1003" font-size="12" fill="#374151" text-anchor="end">Servo V+ comes only from this supply,</text><text x="1360" y="1018" font-size="12" fill="#374151" text-anchor="end">never from the Arduino 5V pin.</text>
<g stroke-width="4" stroke-linecap="round">
<line x1="40" y1="1040" x2="75" y2="1040" stroke="#d62728"/><text x="85" y="1045" font-size="14" fill="#111111">5V / servo V+</text>
<line x1="200" y1="1040" x2="235" y2="1040" stroke="#222222"/><text x="245" y="1045" font-size="14" fill="#111111">GND</text>
<line x1="310" y1="1040" x2="345" y2="1040" stroke="#ff7f0e"/><text x="355" y="1045" font-size="14" fill="#111111">3V3</text>
<line x1="420" y1="1040" x2="455" y2="1040" stroke="#d4a017"/><text x="465" y="1045" font-size="14" fill="#111111">Servo signal</text>
<line x1="590" y1="1040" x2="625" y2="1040" stroke="#2ca02c"/><line x1="630" y1="1040" x2="665" y2="1040" stroke="#1f77b4"/><text x="675" y="1045" font-size="14" fill="#111111">HC-06 serial (TXD, RXD)</text>
<line x1="880" y1="1040" x2="915" y2="1040" stroke="#8e44ad"/><line x1="920" y1="1040" x2="955" y2="1040" stroke="#16a085"/><text x="965" y="1045" font-size="14" fill="#111111">I2C (SDA, SCL)</text>
</g>
<g font-size="14" fill="#374151"><text x="40" y="1080">Crossing wires without a dot are not connected. Servo order 1-7 = the 7 values sent from the Pi (see config.py SERVO_NAMES).</text>
<text x="40" y="1102">Unplug the HC-06 from D0/D1 while uploading code.</text></g>
</svg>
